<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSync - Gym Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">FitSync Dashboard</a>
            <div class="ms-auto">
                <a href="{% url 'branch_list' %}" class="btn btn-outline-light btn-sm me-2">Branches</a>
                <a href="{% url 'attendance_list' %}" class="btn btn-outline-light btn-sm me-2">Attendance</a>
                <a href="{% url 'payment_list' %}" class="btn btn-outline-light btn-sm">Payments</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Block -->
    <div class="container">
        {% block content %}
        {% endblock %}

        <!-- FitSync AI Fitness Assistant Chatbot Section -->
        <div class="card shadow border-0 rounded-4 p-3 mt-4 mb-5">
            <h5 class="text-primary fw-bold mb-3"><i class="fas fa-robot me-2"></i>FitSync AI Fitness Assistant</h5>
            <div id="chat-box" class="border rounded p-3 mb-3" style="height: 200px; overflow-y: scroll; background: #f9f9f9;">
                <p class="text-muted small">Hello! Ask me anything about workouts, diet, or FitSync gym timings.</p>
            </div>
            <div class="input-group">
                <input type="text" id="user-input" class="form-control" placeholder="Type your fitness question...">
                <button class="btn btn-primary" onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AI Chatbot JavaScript -->
    <script>
    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const message = inputField.value.trim();
        if (!message) return;

        // User message display
        chatBox.innerHTML += `<div class="text-end mb-2"><b>You:</b> ${message}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("{% url 'ai_chat' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();
            
            if(data.status === 'success') {
                chatBox.innerHTML += `<div class="text-start mb-2 text-success"><b>AI:</b> ${data.reply}</div>`;
            } else {
                chatBox.innerHTML += `<div class="text-start mb-2 text-danger"><b>AI:</b> Error getting response.</div>`;
            }
        } catch (err) {
            console.error(err);
            chatBox.innerHTML += `<div class="text-start mb-2 text-danger"><b>AI:</b> Network or server error.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    </script>
</body>
</html>
