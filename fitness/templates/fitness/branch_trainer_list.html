<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainers in {{ branch.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="fw-bold mb-3">💪 Trainers in {{ branch.name }}</h2>
        <p class="text-muted">Branch Location: {{ branch.location }}</p>
        
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Trainer Name</th>
                            <th>Specialization</th>
                            <th>Phone</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for trainer in trainers %}
                        <tr>
                            <td>{{ trainer.name }}</td>
                            <td>{{ trainer.specialization }}</td>
                            <td>{{ trainer.phone|default:"N/A" }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center text-muted py-4">No trainers found in this branch.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                <a href="{% url 'branch_list' %}" class="btn btn-secondary mt-3">Back to Branches</a>
            </div>
        </div>
    </div>
</body>
</html>
